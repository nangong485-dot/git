<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 | 官方数据中心</title>
    
    <!-- 外部依赖引入顺序 -->
    <!-- 1. Tailwind CSS (样式框架) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 字体引入 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- 3. Leaflet 地图库 (赛道地图模块使用) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 4. 自定义CSS变量与全局样式 -->
    <style>
        /* === F1 设计系统 - 全局变量 === */
        :root {
            /* 主色调 */
            --f1-red: #E10600;
            --f1-red-dark: #B00500;
            --f1-red-light: #FF3333;
            
            /* 背景色 - 深碳纤维黑 */
            --f1-bg-primary: #0B0B0F;
            --f1-bg-secondary: #15151E;
            --f1-bg-card: #1A1A24;
            --f1-bg-hover: #252530;
            --f1-bg-glass: rgba(21, 21, 30, 0.9);
            
            /* 边框色 */
            --f1-border: #2A2A3A;
            --f1-border-light: #3A3A4A;
            
            /* 文字色 */
            --f1-text-primary: #FFFFFF;
            --f1-text-secondary: #94A3B8;
            --f1-text-muted: #64748B;
            
            /* 状态色 */
            --f1-success: #22C55E;
            --f1-warning: #EAB308;
            --f1-info: #3B82F6;
            --f1-danger: #EF4444;
            
            /* 字体 */
            --f1-font-display: 'Orbitron', sans-serif;
            --f1-font-body: 'Roboto Condensed', sans-serif;
            
            /* 间距 */
            --f1-spacing-xs: 0.25rem;
            --f1-spacing-sm: 0.5rem;
            --f1-spacing-md: 1rem;
            --f1-spacing-lg: 1.5rem;
            --f1-spacing-xl: 2rem;
            
            /* 圆角 */
            --f1-radius-sm: 0.5rem;
            --f1-radius-md: 0.75rem;
            --f1-radius-lg: 1rem;
            --f1-radius-xl: 1.5rem;
            
            /* 过渡 */
            --f1-transition-fast: 0.15s ease;
            --f1-transition-normal: 0.3s ease;
            --f1-transition-slow: 0.5s ease;
        }

        /* === 全局重置 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--f1-font-body);
            background-color: var(--f1-bg-primary);
            color: var(--f1-text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* === F1 风格类 === */
        .f1-red { color: var(--f1-red); }
        .bg-f1-red { background-color: var(--f1-red); }
        .bg-f1-primary { background-color: var(--f1-bg-primary); }
        .bg-f1-secondary { background-color: var(--f1-bg-secondary); }
        .bg-f1-card { background-color: var(--f1-bg-card); }
        .border-f1 { border-color: var(--f1-border); }
        .text-f1-secondary { color: var(--f1-text-secondary); }
        .text-f1-muted { color: var(--f1-text-muted); }

        /* === 导航栏 === */
        .f1-navbar {
            background: linear-gradient(180deg, var(--f1-bg-secondary) 0%, rgba(21, 21, 30, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--f1-border);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all var(--f1-transition-normal);
        }

        .f1-navbar.scrolled {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .f1-nav-logo {
            font-family: var(--f1-font-display);
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .f1-nav-item {
            position: relative;
            padding: 0.5rem 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.875rem;
            transition: all var(--f1-transition-fast);
            cursor: pointer;
            color: var(--f1-text-secondary);
        }

        .f1-nav-item:hover {
            color: var(--f1-red);
            transform: translateY(-1px);
        }

        .f1-nav-item.active {
            color: var(--f1-red);
        }

        .f1-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: var(--f1-red);
            border-radius: 2px;
            animation: slideInLine 0.3s ease;
        }

        @keyframes slideInLine {
            from { width: 0; opacity: 0; }
            to { width: 60%; opacity: 1; }
        }

        /* === 天气卡片 === */
        .weather-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
            backdrop-filter: blur(10px);
        }

        /* === 主内容区域 === */
        .f1-content {
            min-height: calc(100vh - 100px);
            padding-top: 1rem;
        }

        /* === 卡片样式 === */
        .f1-card {
            background: var(--f1-bg-card);
            border: 1px solid var(--f1-border);
            border-radius: var(--f1-radius-lg);
            transition: all var(--f1-transition-normal);
            will-change: transform, box-shadow;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .f1-card:hover {
            border-color: var(--f1-border-light);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(225, 6, 0, 0.1);
        }

        .f1-card-header {
            background: linear-gradient(135deg, var(--f1-red) 0%, var(--f1-red-dark) 100%);
            padding: var(--f1-spacing-lg);
            border-radius: var(--f1-radius-lg) var(--f1-radius-lg) 0 0;
        }

        /* === 按钮样式 === */
        .btn-f1 {
            background: linear-gradient(135deg, var(--f1-red) 0%, var(--f1-red-dark) 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: var(--f1-radius-md);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.875rem;
            transition: all var(--f1-transition-fast);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-f1::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left var(--f1-transition-normal);
        }

        .btn-f1:hover::before {
            left: 100%;
        }

        .btn-f1:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(225, 6, 0, 0.4);
        }

        .btn-f1-secondary {
            background: transparent;
            color: var(--f1-text-secondary);
            border: 1px solid var(--f1-border);
            padding: 0.75rem 1.75rem;
            border-radius: var(--f1-radius-md);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.875rem;
            transition: all var(--f1-transition-fast);
            cursor: pointer;
        }

        .btn-f1-secondary:hover {
            border-color: var(--f1-red);
            color: var(--f1-red);
            background: rgba(225, 6, 0, 0.05);
        }

        /* === 动画 === */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes glow {
            0%, 100% { 
                box-shadow: 0 0 5px var(--f1-red); 
            }
            50% { 
                box-shadow: 0 0 20px var(--f1-red), 0 0 30px rgba(225, 6, 0, 0.5); 
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-pulse { animation: pulse 2s infinite; }
        .animate-slideIn { animation: slideIn 0.5s ease forwards; }
        .animate-glow { animation: glow 2s infinite; }
        .animate-fadeIn { animation: fadeIn 0.3s ease; }

        /* === 滚动条样式 === */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--f1-bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--f1-border);
            border-radius: 4px;
            transition: background var(--f1-transition-fast);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--f1-red);
        }

        /* === 响应式调整 === */
        @media (max-width: 768px) {
            .f1-nav-item {
                font-size: 0.75rem;
                padding: 0.5rem 0.6rem;
                letter-spacing: 0.05em;
            }
            
            .f1-nav-logo {
                font-size: 1.25rem;
            }
            
            .weather-card {
                display: none !important;
            }
        }

        @media (max-width: 640px) {
            .f1-navbar {
                padding: 0.75rem var(--f1-spacing-md);
            }
            
            .f1-content {
                padding: var(--f1-spacing-md);
            }
        }

        /* === 模块特定样式 === */
        .team-bar {
            width: 4px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 2px;
        }

        .standings-row {
            transition: all var(--f1-transition-fast);
            cursor: pointer;
            position: relative;
            will-change: transform, background-color;
            transform: translateZ(0);
        }

        .standings-row:hover {
            background-color: var(--f1-bg-hover);
            transform: translateX(6px) translateZ(0);
        }

        /* 分站积分卡片样式 */
        .driver-details-container {
            animation: fadeIn 0.3s ease;
        }

        .race-points-card {
            transition: all var(--f1-transition-fast);
            position: relative;
            overflow: hidden;
            will-change: transform, background-color;
            transform: translateZ(0);
        }

        .race-points-card:hover {
            transform: translateY(-3px) translateZ(0);
            border-color: var(--f1-red);
            background: rgba(225, 6, 0, 0.05);
        }

        .race-points-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--f1-red), transparent);
            opacity: 0;
            transition: opacity var(--f1-transition-fast);
        }

        .race-points-card:hover::before {
            opacity: 1;
        }

        /* 车手照片样式 */
        .driver-photo {
            transition: all var(--f1-transition-fast);
            border: 2px solid transparent;
            will-change: transform, box-shadow;
            transform: translateZ(0);
        }

        .driver-photo:hover {
            transform: scale(1.05) translateZ(0);
            border-color: var(--f1-red);
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.5);
        }

        .driver-placeholder {
            transition: all var(--f1-transition-fast);
        }

        .driver-placeholder:hover {
            background-color: var(--f1-red);
            color: white;
        }

        /* 车队图标样式 */
        .team-logo-container {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--f1-transition-fast);
            will-change: transform, box-shadow;
            transform: translateZ(0);
        }

        .team-logo-container:hover {
            transform: scale(1.1) translateZ(0);
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.5);
        }

        /* 分站积分网格响应式 */
        @media (max-width: 1024px) {
            .driver-details-container .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .driver-details-container .grid {
                grid-template-columns: 1fr;
            }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
        }

        .modal-content {
            animation: slideIn 0.3s ease;
        }

        .tab-active {
            border-bottom: 3px solid var(--f1-red);
            color: var(--f1-red);
            background: rgba(225, 6, 0, 0.05);
        }

        .live-indicator {
            animation: pulse 1.5s infinite;
        }

        .countdown-number {
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum';
            font-family: var(--f1-font-display);
        }

        .countdown-box {
            transition: transform var(--f1-transition-normal), background-color var(--f1-transition-fast);
            will-change: transform;
            transform: translateZ(0);
        }

        .countdown-box:hover {
            transform: scale(1.08) translateZ(0);
            background: rgba(225, 6, 0, 0.1) !important;
        }

        .timeline-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 4px solid var(--f1-bg-secondary);
            z-index: 1;
            transition: all var(--f1-transition-fast);
        }

        .timeline-line {
            width: 3px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--f1-border);
        }

        .status-completed {
            opacity: 0.6;
        }

        .status-current .timeline-dot {
            border-color: var(--f1-red);
            box-shadow: 0 0 25px rgba(225, 6, 0, 0.6);
            animation: pulse 1.5s infinite;
        }

        .flashing-text {
            animation: pulse 1s infinite;
        }

        .event-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* === 热力图样式 === */
        .gear-indicator {
            transition: all var(--f1-transition-fast);
        }

        .gear-indicator.active {
            background: var(--f1-red) !important;
            color: white;
        }

        .news-filter-btn.active {
            background: linear-gradient(135deg, var(--f1-red) 0%, var(--f1-red-dark) 100%) !important;
            color: white !important;
        }

        /* === 加载状态 === */
        .loading-spinner {
            border: 3px solid var(--f1-border);
            border-top-color: var(--f1-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           F1 殿堂级 UI/UX 设计系统 - 全面升级
           ============================================ */

        /* === 1. 碳纤维纹理背景 === */
        .carbon-fiber-bg {
            background-color: var(--f1-bg-primary);
            background-image: 
                linear-gradient(127deg, transparent 0%, rgba(255,255,255,0.02) 50%, transparent 50%),
                linear-gradient(127deg, transparent 0%, rgba(255,255,255,0.02) 50%, transparent 50%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.01) 2px,
                    rgba(255,255,255,0.01) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255,255,255,0.01) 2px,
                    rgba(255,255,255,0.01) 4px
                );
            background-size: 4px 4px, 4px 4px, 8px 8px, 8px 8px;
        }

        /* 科技网格背景 */
        .tech-grid-bg {
            background-color: var(--f1-bg-primary);
            background-image: 
                linear-gradient(rgba(225,6,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(225,6,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 斜线条背景纹理 */
        .diagonal-lines-bg {
            background-color: var(--f1-bg-primary);
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.005) 10px,
                rgba(255,255,255,0.005) 20px
            );
        }

        /* === 2. 斜切角设计 (Slanted Edges) === */
        .slanted-top-left {
            clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
        }

        .slanted-top-right {
            clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
        }

        .slanted-bottom-right {
            clip-path: polygon(0 0, 100% 0, 100% 92%, 8% 100%);
        }

        .slanted-both-corners {
            clip-path: polygon(5% 0, 95% 0, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0 95%, 0 5%);
        }

        /* 斜角装饰线 */
        .slanted-accent {
            position: relative;
        }

        .slanted-accent::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 100%;
            background: linear-gradient(to bottom left, transparent 50%, var(--f1-red) 50%);
            opacity: 0.3;
            pointer-events: none;
        }

        /* === 3. 流光边框特效 (Neon Border Flow) === */
        .neon-border {
            position: relative;
            border: 1px solid var(--f1-border);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .neon-border::before,
        .neon-border::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        /* 流动光线 */
        .neon-border::before {
            background: linear-gradient(
                90deg,
                transparent 0%,
                transparent 45%,
                var(--f1-red) 50%,
                transparent 55%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: neonFlow 2.5s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .neon-border:hover::before,
        .neon-border.active::before {
            opacity: 1;
        }

        .neon-border::after {
            border: 1px solid transparent;
            background: linear-gradient(var(--f1-bg-card), var(--f1-bg-card)) padding-box,
                        linear-gradient(90deg, var(--f1-red), transparent, var(--f1-red)) border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .neon-border:hover::after,
        .neon-border.active::after {
            opacity: 0.6;
        }

        @keyframes neonFlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 增强版流光边框 - 四边流动 */
        .neon-border-full {
            position: relative;
        }

        .neon-border-full::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                var(--f1-red) 60deg,
                transparent 120deg,
                transparent 240deg,
                var(--f1-red) 300deg,
                transparent 360deg
            );
            border-radius: inherit;
            animation: neonBorderRotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .neon-border-full:hover::before,
        .neon-border-full.active::before {
            opacity: 1;
        }

        @keyframes neonBorderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === 4. 交错入场动画 (Staggered Entrance) === */
        .stagger-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: staggerFadeIn 0.5s ease forwards;
        }

        @keyframes staggerFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 列表项交错动画 */
        .stagger-item {
            opacity: 0;
            transform: translateX(-20px);
            animation: staggerSlideIn 0.4s ease forwards;
        }

        @keyframes staggerSlideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 卡片网格交错入场 */
        .stagger-card {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: staggerCardIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes staggerCardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* === 5. 3D 悬停倾斜效果 (Hover Physics) === */
        .tilt-card {
            perspective: 1000px;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .tilt-card-inner {
            transition: transform 0.15s ease-out;
            will-change: transform;
            transform-style: preserve-3d;
        }

        .tilt-card:hover .tilt-card-inner {
            transform: rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg));
        }

        /* 破风装饰线 */
        .speed-line {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 30px;
            background: linear-gradient(90deg, var(--f1-red), transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .tilt-card:hover .speed-line {
            transform: scaleX(4);
        }

        /* 3D 卡片阴影 */
        .tilt-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            border-radius: inherit;
            filter: blur(20px);
            opacity: 0;
            transform: translateZ(-30px);
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .tilt-card:hover::after {
            opacity: 0.5;
        }

        /* === 6. 数据刷新动态闪烁 (Data Pulse) === */
        .data-flash {
            animation: dataFlash 0.6s ease-out;
        }

        @keyframes dataFlash {
            0% {
                color: var(--f1-red);
                text-shadow: 0 0 10px var(--f1-red), 0 0 20px var(--f1-red);
                transform: scale(1.1);
            }
            100% {
                color: inherit;
                text-shadow: none;
                transform: scale(1);
            }
        }

        /* 数值跳动效果 */
        .value-bounce {
            animation: valueBounce 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes valueBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 背景脉冲闪烁 */
        .bg-pulse {
            animation: bgPulse 0.6s ease-out;
        }

        @keyframes bgPulse {
            0% {
                background-color: rgba(225, 6, 0, 0.3);
            }
            100% {
                background-color: transparent;
            }
        }

        /* === 7. 增强版骨架屏 (Enhanced Skeleton) === */
        .skeleton {
            background: linear-gradient(
                90deg,
                var(--f1-bg-card) 0%,
                var(--f1-bg-hover) 50%,
                var(--f1-bg-card) 100%
            );
            background-size: 200% 100%;
            animation: skeletonShimmer 1.8s ease-in-out infinite;
            border-radius: var(--f1-radius-sm);
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 全息扫描线骨架屏 */
        .skeleton-holo {
            position: relative;
            overflow: hidden;
        }

        .skeleton-holo::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 230, 118, 0.1) 50%,
                transparent 100%
            );
            animation: holoScan 1.5s ease-in-out infinite;
        }

        @keyframes holoScan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* === 8. 硬件加速优化 === */
        .hw-accelerate {
            will-change: transform, opacity;
            backface-visibility: hidden;
            perspective: 1000px;
        }

        .gpu-layer {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* === 9. 导航栏斜角装饰 === */
        .nav-slanted {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 40px) 100%, 0 100%);
        }

        .nav-item-glow {
            position: relative;
        }

        .nav-item-glow::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: radial-gradient(ellipse at center, rgba(225, 6, 0, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .nav-item-glow:hover::before {
            opacity: 1;
        }

        /* === 10. F1 字重非对称标题 === */
        .f1-display-title {
            font-family: var(--f1-font-display);
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: clamp(1.5rem, 4vw, 3rem);
            line-height: 1.1;
        }

        .f1-display-title .accent {
            color: var(--f1-red);
            display: inline-block;
        }

        /* 数字等宽字体 */
        .mono-numbers {
            font-variant-numeric: tabular-nums;
            font-feature-settings: 'tnum';
            font-family: var(--f1-font-display);
            letter-spacing: 0.05em;
        }

        /* === 11. 按钮悬停流光 === */
        .btn-speed {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-speed::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.5s ease;
        }

        .btn-speed:hover::before {
            left: 150%;
        }

        /* === 12. 升级追踪器专用样式 === */
        .part-glow-green {
            filter: drop-shadow(0 0 8px #00E676) drop-shadow(0 0 16px rgba(0, 230, 118, 0.5));
            animation: holoGlowGreen 2s ease-in-out infinite;
        }

        .part-glow-red {
            filter: drop-shadow(0 0 8px #E10600) drop-shadow(0 0 16px rgba(225, 6, 0, 0.5));
            animation: holoGlowRed 2s ease-in-out infinite;
        }

        .part-glow-yellow {
            filter: drop-shadow(0 0 8px #FFB300) drop-shadow(0 0 16px rgba(255, 179, 0, 0.5));
            animation: holoGlowYellow 2s ease-in-out infinite;
        }

        @keyframes holoGlowGreen {
            0%, 100% { filter: drop-shadow(0 0 8px #00E676) drop-shadow(0 0 16px rgba(0, 230, 118, 0.3)); }
            50% { filter: drop-shadow(0 0 12px #00E676) drop-shadow(0 0 24px rgba(0, 230, 118, 0.6)); }
        }

        @keyframes holoGlowRed {
            0%, 100% { filter: drop-shadow(0 0 8px #E10600) drop-shadow(0 0 16px rgba(225, 6, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 12px #E10600) drop-shadow(0 0 24px rgba(225, 6, 0, 0.6)); }
        }

        @keyframes holoGlowYellow {
            0%, 100% { filter: drop-shadow(0 0 8px #FFB300) drop-shadow(0 0 16px rgba(255, 179, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 12px #FFB300) drop-shadow(0 0 24px rgba(255, 179, 0, 0.6)); }
        }

        /* SVG 描边入场动画 */
        .draw-stroke {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawStroke 2.5s ease-out forwards;
        }

        @keyframes drawStroke {
            to { stroke-dashoffset: 0; }
        }

        /* 聚光灯效应 */
        .spotlight-group {
            transition: opacity 0.3s ease;
        }

        .spotlight-active path,
        .spotlight-active rect,
        .spotlight-active ellipse {
            opacity: 1 !important;
        }

        /* 流光点击反馈 */
        .flash-feedback {
            animation: flashEffect 0.3s ease-out;
        }

        @keyframes flashEffect {
            0% { filter: brightness(3) drop-shadow(0 0 20px white); }
            100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
        }

        /* 升级指示器脉冲 */
        .upgrade-indicator {
            animation: indicatorPulse 1.5s ease-in-out infinite;
        }

        @keyframes indicatorPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* 卡片入场动画 */
        .upgrade-card-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: cardSlideIn 0.5s ease forwards;
        }

        @keyframes cardSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 骨架屏卡片 */
        .skeleton-card {
            background: var(--f1-bg-card);
            border: 1px solid var(--f1-border);
            border-radius: var(--f1-radius-lg);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.03) 50%,
                transparent 100%
            );
            animation: holoScan 2s ease-in-out infinite;
        }

        .skeleton-line {
            background: linear-gradient(
                90deg,
                var(--f1-bg-hover) 0%,
                rgba(255, 255, 255, 0.1) 50%,
                var(--f1-bg-hover) 100%
            );
            background-size: 200% 100%;
            animation: skeletonShimmer 1.8s ease-in-out infinite;
            border-radius: 4px;
        }

        /* === 13. 新闻卡片样式 === */
        .news-card-tilt {
            perspective: 1200px;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .news-card-tilt-inner {
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        /* === 14. Tab 切换动画 === */
        .tab-content {
            animation: tabFadeIn 0.3s ease;
        }

        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === 15. 滚动驱动动画 (Scroll Reveal) === */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* === 16. 倒计时数字闪烁 === */
        .countdown-flash {
            animation: countdownPulse 1s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>

        <!-- 全息扫描线动画样式 (性能优化: 使用transform而非width) -->
        <style>
            /* === 骨架屏全息扫描动画 === */
            @keyframes holoScan {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(100%); }
            }
            @keyframes holoPulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 0.6; }
            }
            .skeleton-card {
                position: relative;
                overflow: hidden;
                background: linear-gradient(135deg, #15161E 0%, #1A1A24 100%);
                border: 1px solid rgba(255,255,255,0.05);
                border-radius: 12px;
                padding: 16px;
            }
            .skeleton-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 50%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(0,230,118,0.1), transparent);
                animation: holoScan 1.5s ease-in-out infinite;
            }
            .skeleton-line {
                background: linear-gradient(90deg, #2A2A3A 0%, #3A3A4A 50%, #2A2A3A 100%);
                animation: holoPulse 2s ease-in-out infinite;
                border-radius: 4px;
            }

            /* === SVG 描边入场动画 === */
            @keyframes drawStroke {
                to { stroke-dashoffset: 0; }
            }
            .car-part-path {
                stroke-dasharray: 1000;
                stroke-dashoffset: 1000;
                animation: drawStroke 2s ease-out forwards;
            }
            .car-part-path.delay-1 { animation-delay: 0.2s; }
            .car-part-path.delay-2 { animation-delay: 0.4s; }
            .car-part-path.delay-3 { animation-delay: 0.6s; }
            .car-part-path.delay-4 { animation-delay: 0.8s; }

            /* === 全息呼吸光晕特效 === */
            @keyframes holoGlow {
                0%, 100% { 
                    filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 8px currentColor);
                    opacity: 0.7;
                }
                50% { 
                    filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor) drop-shadow(0 0 30px currentColor);
                    opacity: 1;
                }
            }
            @keyframes rippleExpand {
                0% { r: 5; opacity: 0.8; }
                100% { r: 25; opacity: 0; }
            }
            .part-glow-green { 
                color: #00E676; 
                animation: holoGlow 2s ease-in-out infinite;
            }
            .part-glow-red { 
                color: #E10600; 
                animation: holoGlow 2s ease-in-out infinite;
            }
            .part-glow-yellow {
                color: #FFB300;
                animation: holoGlow 2s ease-in-out infinite;
            }
            .upgrade-ripple circle {
                animation: rippleExpand 1.5s ease-out infinite;
            }

            /* === 聚光灯效应 === */
            .spotlight-dim { opacity: 0.3; transition: opacity 0.3s ease; }
            .spotlight-active { opacity: 1; transition: opacity 0.3s ease; }

            /* === 卡片错落入场动画 === */
            @keyframes cardSlideIn {
                from { 
                    opacity: 0; 
                    transform: translateY(30px); 
                }
                to { 
                    opacity: 1; 
                    transform: translateY(0); 
                }
            }
            .upgrade-card-enter {
                animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                opacity: 0;
            }

            /* === 流光点击反馈 === */
            @keyframes flashPulse {
                0% { opacity: 1; }
                50% { opacity: 0.3; }
                100% { opacity: 1; }
            }
            .flash-feedback {
                animation: flashPulse 0.3s ease-out;
            }

            /* === 升级徽章动画 === */
            @keyframes badgeBounce {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.1); }
            }
            .upgrade-badge-new {
                animation: badgeBounce 2s ease-in-out infinite;

            /* === 升级计数器气泡 === */
            @keyframes bubblePing {
                0% { transform: scale(1); opacity: 1; }
                100% { transform: scale(1.5); opacity: 0; }
            }
            .bubble-ping::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 2px solid currentColor;
                animation: bubblePing 1.5s ease-out infinite;
            }
        </style>

    <!-- === JavaScript 模块化代码 === -->
    <script>
        // === F1 模块系统 (IIFE 模块化) ===
        const F1Modules = (function() {
            // 私有变量
            let standingsData = null;
            let scheduleData = null;
            let trackData = null;
            let newsData = null;
            let heatmapData = null;
            let mapInstance = null;
            let currentFilter = 'all';
            let playbackInterval = null;
            let currentFrame = 0;
            let isPlaying = false;

            // 工具函数
            const formatNumber = (num) => String(num).padStart(2, '0');
            
            return {
                // === 初始化导航切换 ===
                initNavigation: function() {
                    const navItems = document.querySelectorAll('.f1-nav-item');
                    const contentContainer = document.getElementById('content-container');

                    // 初始加载第一个模块
                    this.loadModule('standings');

                    // 导航点击事件
                    navItems.forEach(item => {
                        item.addEventListener('click', function() {
                            navItems.forEach(i => i.classList.remove('active'));
                            this.classList.add('active');
                            const section = this.dataset.section;
                            F1Modules.loadModule(section);
                        });
                    });

                    // 更新时间
                    this.updateLastUpdate();
                    setInterval(() => this.updateLastUpdate(), 60000);

                    // 导航栏滚动效果
                    window.addEventListener('scroll', () => {
                        const navbar = document.querySelector('.f1-navbar');
                        if (window.scrollY > 50) {
                            navbar.classList.add('scrolled');
                        } else {
                            navbar.classList.remove('scrolled');
                        }
                    });
                },

                updateLastUpdate: function() {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('lastUpdate').textContent = timeStr;
                },

                loadModule: function(moduleName) {
                    const template = document.getElementById(`module-${moduleName}`);
                    const contentContainer = document.getElementById('content-container');
                    
                    if (template) {
                        contentContainer.innerHTML = template.innerHTML;
                        
                        // 添加入场动画类
                        contentContainer.classList.add('tab-content');
                        
                        // 初始化对应模块
                        switch(moduleName) {
                            case 'standings':
                                this.initStandings();
                                // 积分榜列表交错入场
                                setTimeout(() => {
                                    this.staggerEntrance('.standings-table', '.standings-row', 40);
                                }, 100);
                                break;
                            case 'schedule':
                                this.initSchedule();
                                // 赛程卡片交错入场
                                setTimeout(() => {
                                    this.staggerEntrance('.race-grid', '.race-card', 60);
                                }, 100);
                                break;
                            case 'track-map':
                                this.initTrackMap();
                                break;
                            case 'news':
                                this.initNews();
                                // 新闻卡片 3D 倾斜初始化
                                setTimeout(() => {
                                    this.initNewsTilt();
                                    this.staggerEntrance('.news-grid', '.news-item', 80);
                                }, 100);
                                break;
                            case 'upgrades':
                                this.initUpgrades();
                                // 升级卡片入场动画
                                setTimeout(() => {
                                    this.animateUpgradesIn();
                                    this.initTiltCards();
                                }, 100);
                                break;
                            
                        }
                    }
                },

                // === 积分榜模块 ===
                initStandings: function() {
                    // 车队颜色映射
                    const teamColors = {
                        'Red Bull Racing': '#1E41FF',
                        'Ferrari': '#DC0000',
                        'McLaren': '#FF8000',
                        'Mercedes': '#27F4D2',
                        'Aston Martin': '#229971',
                        'Williams': '#64C4FF',
                        'Alpine': '#0090FF',
                        'Haas F1 Team': '#BDBFF4',
                        'RB': '#5E8FAA',
                        'Kick Sauber': '#0066B8'
                    };

                    // 显示加载状态
                    this.showLoading();

                    // 使用 Jolpica F1 API 获取数据
                    this.fetchStandingsFromJolpica().then((data) => {
                        this.renderDriversTable(data.drivers);
                        this.renderConstructorsTable(data.constructors);
                        this.hideLoading();
                    }).catch((error) => {
                        console.error('Failed to fetch standings data:', error);
                        this.hideLoading();
                        this.showError(error.message || '数据加载失败，请稍后重试');
                    });

                    // Tab 切换
                    const driversTab = document.getElementById('driversTab');
                    const constructorsTab = document.getElementById('constructorsTab');
                    const driversTable = document.getElementById('driversTable');
                    const constructorsTable = document.getElementById('constructorsTable');
                    
                    if (driversTab) {
                        driversTab.addEventListener('click', () => {
                            if (driversTable) driversTable.style.display = 'block';
                            if (constructorsTable) constructorsTable.style.display = 'none';
                            driversTab.classList.add('tab-active');
                            if (constructorsTab) constructorsTab.classList.remove('tab-active');
                        });
                    }
                    
                    if (constructorsTab) {
                        constructorsTab.addEventListener('click', () => {
                            if (constructorsTable) constructorsTable.style.display = 'block';
                            if (driversTable) driversTable.style.display = 'none';
                            constructorsTab.classList.add('tab-active');
                            if (driversTab) driversTab.classList.remove('tab-active');
                        });
                    }
                },

                // 使用 Jolpica F1 API 获取积分榜数据
                fetchStandingsFromJolpica: async function() {
                    try {
                        // 并行获取车手和车队积分榜数据
                        const [driverStandings, constructorStandings, allDrivers, raceResults] = await Promise.all([
                            this.fetchDriverStandings(),
                            this.fetchConstructorStandings(),
                            this.fetchAllDrivers(),
                            this.fetchRaceResults() // 获取分站积分数据
                        ]);

                        // 车队颜色映射
                        const teamColors = {
                            'Red Bull Racing': '#1E41FF',
                            'Ferrari': '#DC0000',
                            'McLaren': '#FF8000',
                            'Mercedes': '#27F4D2',
                            'Aston Martin': '#229971',
                            'Williams': '#64C4FF',
                            'Alpine': '#0090FF',
                            'Haas F1 Team': '#BDBFF4',
                            'RB': '#5E8FAA',
                            'Kick Sauber': '#0066B8'
                        };

                        // 处理车手积分榜数据，添加分站积分信息
                        const processedDrivers = driverStandings.map((standing) => {
                            const driverId = standing.Driver.driverId;
                            const racePoints = this.extractDriverRacePoints(raceResults, driverId);
                            
                            // 构建车手照片URL（使用F1官方CDN）
                            const driverPhoto = `https://media.formula1.com/content/dam/fom-website/drivers/${driverId.toUpperCase()}/${driverId}.png.transform/2col/image.png`;
                            
                            return {
                                position: parseInt(standing.position),
                                name: `${standing.Driver.givenName.charAt(0)}. ${standing.Driver.familyName}`,
                                fullName: `${standing.Driver.givenName} ${standing.Driver.familyName}`,
                                team: standing.Constructors[0].name,
                                points: parseInt(standing.points),
                                wins: parseInt(standing.wins),

                                status: 'active',
                                color: teamColors[standing.Constructors[0].name] || '#64748B',
                                driverId: driverId,
                                racePoints: racePoints,
                                photo: driverPhoto,
                                number: standing.Driver.permanentNumber || ''
                            };
                        });

                        // 将没有积分的车手添加到列表末尾
                        const driverIds = new Set(driverStandings.map(s => s.Driver.driverId));
                        const missingDrivers = allDrivers.filter(d => !driverIds.has(d.driverId));

                    const data = await response.json();

                // 提取车手的分站积分
                extractDriverRacePoints: function(races, driverId) {
                    const racePoints = [];
                    races.forEach(race => {
                        const result = race.Results.find(r => r.Driver.driverId === driverId);
                        if (result) {
                            racePoints.push({
                                raceName: race.raceName,
                                circuit: race.Circuit.circuitName,
                                country: race.Circuit.Location.country,
                                date: race.date,
                                position: result.position,
                                points: parseInt(result.points) || 0,
                                grid: result.grid,
                                status: result.status
                            });
                        }
                    });
                    return racePoints;
                },

                // 获取赛程数据
                fetchSchedule: async function() {
                    try {
                        // 使用 Jolpica F1 API（Ergast API 官方镜像，支持 CORS）
                        const scheduleResponse = await fetch('https://api.jolpi.ca/ergast/f1/2026.json');
                        if (!scheduleResponse.ok) {
                            throw new Error('无法获取赛程数据');
                        }
                        const scheduleData = await scheduleResponse.json();
                        const races = scheduleData.MRData.RaceTable.Races;
                        
                        if (!races || races.length === 0) {
                            throw new Error('2026赛季赛程数据暂未发布');
                        }

                        // 获取比赛结果数据
                        let raceResults = {};
                        try {
                            // 使用 Jolpica 正确的比赛结果端点
                            const resultsResponse = await fetch('https://api.jolpi.ca/ergast/f1/2026/results');
                            if (resultsResponse.ok) {
                                const resultsData = await resultsResponse.json();
                                // 按比赛 round 索引结果
                                if (resultsData.MRData && resultsData.MRData.RaceTable && resultsData.MRData.RaceTable.Races) {
                                    resultsData.MRData.RaceTable.Races.forEach(race => {
                                        if (race.round && race.Results && race.Results[0]) {
                                            raceResults[race.round] = {
                                                winner: race.Results[0].Driver.givenName + ' ' + race.Results[0].Driver.familyName,
                                                winnerTeam: race.Results[0].Constructor.name,
                                                position: race.Results[0].position
                                            };
                                        }
                                    });
                                }
                            } else {
                                console.warn('比赛结果 API 响应失败:', resultsResponse.status);
                            }
                        } catch (e) {
                            console.warn('无法获取比赛结果:', e);
                        }

                        // 获取当前北京时间
                        const now = this.getBeijingTime();

                        return races.map((race, index) => {
                            const raceDateTime = new Date(`${race.date}T${race.time || '14:00:00'}`);
                            let status = 'upcoming';
                            
                            // 判断比赛状态（使用北京时间比较）
                            if (raceDateTime > now) {
                                status = 'upcoming';
                            } else {
                                // 检查比赛是否结束（假设比赛在开始时间 + 3 小时后结束）
                                const raceEndTime = new Date(raceDateTime.getTime() + 3 * 60 * 60 * 1000);
                                if (raceEndTime < now) {
                                    status = 'completed';
                                } else {
                                    status = 'current'; // 正在进行
                                }
                            }

                            // 转换为北京时间并格式化
                            const beijingDate = this.convertToBeijingTime(`${race.date}T${race.time || '14:00:00'}`);
                            const dateStr = beijingDate.toLocaleDateString('zh-CN', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit'
                            });
                            const timeStr = beijingDate.toLocaleTimeString('zh-CN', {
                                hour: '2-digit',
                                minute: '2-digit',
                                hour12: false,
                                timeZone: 'Asia/Shanghai'
                            });

                            // 获取比赛结果
                            const result = raceResults[race.round] || {};

                            return {
                                id: index + 1,
                                name: race.raceName,
                                circuit: race.Circuit.circuitName,
                                country: race.Circuit.Location.country,
                                date: dateStr,
                                time: timeStr,
                                status: status,
                                winner: result.winner || null,
                                winnerTeam: result.winnerTeam || null,
                                round: race.round,
                                originalDate: beijingDate // 保存原始北京时间用于倒计时
                            };
                        });
                    } catch (error) {
                        console.warn('赛程 API 不可用，使用本地数据');
                        return this.getFallbackSchedule();
                    }
                },

                startCountdown: function(races) {
                    // 保存 this 引用以便在内部函数中使用
                    const self = this;
                    
                    // 找到下一场即将到来的比赛（使用北京时间比较）
                    const now = self.getBeijingTime();
                    const upcomingRaces = races.filter(race => {
                        // 使用保存的北京时间日期进行比较
                        return race.originalDate > now;
                    });
                    
                    if (upcomingRaces.length === 0) {
                        document.getElementById('nextRaceTitle').textContent = '本赛季已结束';
                        return;
                    }

                    const nextRace = upcomingRaces[0];
                    // 使用保存的北京时间日期进行倒计时
                    const raceDateTime = nextRace.originalDate;

                    document.getElementById('nextRaceTitle').textContent = nextRace.name;

                    function updateCountdown() {
                        // 使用北京时间计算倒计时
                        const now = self.getBeijingTime();
                        const diff = raceDateTime - now;

                        if (diff <= 0) {
                            const titleEl = document.getElementById('nextRaceTitle');
                            if (titleEl) {
                                titleEl.innerHTML = '<span class="f1-red flashing-text">比赛进行中!</span>';
                            }
                            return;
                        }

                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                        const countdownDays = document.getElementById('countdownDays');
                        const countdownHours = document.getElementById('countdownHours');
                        const countdownMinutes = document.getElementById('countdownMinutes');
                        const countdownSeconds = document.getElementById('countdownSeconds');

                        if (countdownDays) {
                            const numEl = countdownDays.querySelector('.countdown-number');
                            if (numEl) numEl.textContent = formatNumber(days);
                        }
                        if (countdownHours) {
                            const numEl = countdownHours.querySelector('.countdown-number');
                            if (numEl) numEl.textContent = formatNumber(hours);
                        }
                        if (countdownMinutes) {
                            const numEl = countdownMinutes.querySelector('.countdown-number');
                            if (numEl) numEl.textContent = formatNumber(minutes);
                        }
                        if (countdownSeconds) {
                            const numEl = countdownSeconds.querySelector('.countdown-number');
                            if (numEl) numEl.textContent = formatNumber(seconds);
                        }
                    }

                    updateCountdown();
                    setInterval(updateCountdown, 1000);
                },

                        newsGrid.innerHTML = `

                                        </div>
                                    `).join('')}
                                </div>

                        `;
                    }

                    // 获取新闻数据
                    this.fetchAllNews().then((news) => {
                        newsData = news;
                        this.renderNews(newsData);
                    }).catch((error) => {
                        console.error('Failed to fetch news:', error);
                        this.showNewsError(error.message || '新闻数据加载失败');
                    });
                },

                // RSS 订阅源配置
                rssSources: {
                    f1: {
                        url: 'https://www.formula1.com/en/latest/all.xml',
                        label: 'Official',
                        category: 'official',
                        color: 'bg-green-500'
                    },
                    crash: {
                        url: 'https://www.crash.net/rss/f1',
                        label: 'Paddock Rumors',
                        category: 'rumors',
                        color: 'bg-yellow-500'
                    },
                    motorsport: {
                        url: 'https://www.motorsport.com/rss/f1/news/',
                        label: 'Technical',
                        category: 'technical',
                        color: 'bg-blue-500'
                    }
                },

                // 并发获取所有 RSS 源数据
                fetchAllNews: async function() {
                    const rss2jsonUrl = 'https://api.rss2json.com/v1/api.json?rss_url=';
                    const sources = Object.entries(this.rssSources);
                    
                    // 并发请求所有源
                    const promises = sources.map(async ([key, source]) => {
                        try {
                            const response = await fetch(rss2jsonUrl + encodeURIComponent(source.url));
                            if (!response.ok) {
                                console.warn(`Failed to fetch ${source.label} news`);
                                return [];
                            }
                            const data = await response.json();
                            
                            // 转换新闻数据格式
                            return data.items.map(item => ({
                                id: item.guid || item.link,
                                title: item.title,
                                link: item.link,
                                pubDate: item.pubDate,
                                description: item.description,
                                thumbnail: item.thumbnail || item.enclosure?.link,
                                source: key,
                                category: source.category,
                                label: source.label,
                                color: source.color
                            }));
                        } catch (error) {
                            console.warn(`Error fetching ${source.label}:`, error);
                            return [];
                        }
                    });

                    // 等待所有请求完成
                    const results = await Promise.all(promises);
                    
                    // 合并所有新闻
                    const allNews = results.flat();
                    
                    // 按发布时间排序（从新到旧）
                    allNews.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                    
                    return allNews.slice(0, 12); // 只取前12条最新新闻
                },

                showNewsError: function(message) {
                    const newsGrid = document.getElementById('newsGrid');
                    if (newsGrid) {
                        newsGrid.innerHTML = `
                            <div class="flex flex-col items-center justify-center py-12 col-span-full">
                                <svg class="w-16 h-16 text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                </svg>
                                <span class="text-f1-red text-lg">⚠ ${message}</span>
                                <p class="text-gray-500 mt-2">请稍后重试或检查网络连接</p>
                            </div>
                        `;
                    }
                },

                renderNews: function(data) {
                    const container = document.getElementById('newsGrid');
                    if (!container) return;
                    
                    container.innerHTML = data.map((news, index) => {
                        // 获取图片或使用占位图
                        const imageUrl = news.thumbnail || `https://neeko-copilot.bytedance.net/api/text_to_image?prompt=${encodeURIComponent('F1 racing news article dark background')}&image_size=landscape_16_9`;
                        
                        // 格式化日期
                        const date = new Date(news.pubDate);
                        const formattedDate = date.toLocaleDateString('zh-CN', {
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        
                        // 截断摘要（去除HTML标签）
                        const summary = news.description.replace(/<[^>]*>/g, '').substring(0, 120) + '...';
                        
                        return `
                            <div class="news-item tilt-card f1-card overflow-hidden hover:border-f1-red transition-all duration-300 cursor-pointer"

                    this.fetchUpgradeData(raceId).then(allUpgrades => {
                        // 筛选
                        let filtered = allUpgrades;
                        if (teamId !== 'all') {
                            filtered = filtered.filter(u => u.team === teamId);
                        }
                        if (currentFilter !== 'all') {

                        }
                        
                        // 更新SVG高亮
                        this.updateBlueprintHighlights(allUpgrades, teamId);
                        
                        // 渲染列表
                        if (upgradesList) {
                            if (filtered.length === 0) {

                // 更新SVG蓝图高亮
                updateBlueprintHighlights: function(upgrades, teamFilter) {
                    const components = ['Front Wing', 'Floor', 'Sidepod', 'Rear Wing', 'Suspension', 'PU'];
                    
                    // 重置所有部件样式
                    components.forEach(comp => {
                        const part = document.getElementById(`part-${comp}`);
                        if (part) {
                            // 移除高亮类
                            part.classList.remove('part-glow-green', 'part-glow-red', 'part-glow-yellow');
                            // 隐藏升级指示器
                            const indicator = part.querySelector('.upgrade-indicator');
                            if (indicator) indicator.classList.add('hidden');
                            // 重置填充色和滤镜
                            part.querySelectorAll('path, rect, ellipse, circle').forEach(el => {
                                el.style.fill = '';
                                el.style.opacity = '';
                                el.style.filter = '';
                            });
                        }
                    });
                    
                    // 筛选该车队的升级
                    const teamUpgrades = teamFilter === 'all' 
                        ? upgrades 
                        : upgrades.filter(u => u.team === teamFilter);
                    
                    // 统计升级数量
                    let perfCount = 0;
                    let circuitCount = 0;
                    
                    // 高亮有升级的部件
                    teamUpgrades.forEach(upgrade => {
                        const part = document.getElementById(`part-${upgrade.component}`);
                        if (part) {
                            // 显示升级指示器
                            const indicator = part.querySelector('.upgrade-indicator');
                            if (indicator) {
                                indicator.classList.remove('hidden');
                                // 根据升级数量更新显示
                                const countText = indicator.querySelector('text');
                                if (countText) {
                                    const count = teamUpgrades.filter(u => u.component === upgrade.component).length;
                                    countText.textContent = `+${count}`;
                                }
                            }
                            
                            if (upgrade.category === 'Performance') {
                                part.classList.add('part-glow-green');
                                part.querySelectorAll('path, rect').forEach(el => {
                                    el.style.fill = 'rgba(0,230,118,0.2)';
                                    el.style.stroke = '#00E676';
                                });
                                perfCount++;
                            } else if (upgrade.category === 'Circuit-Specific') {
                                part.classList.add('part-glow-red');
                                part.querySelectorAll('path, rect').forEach(el => {
                                    el.style.fill = 'rgba(225,6,0,0.2)';
                                    el.style.stroke = '#E10600';
                                });
                                circuitCount++;
                            }
                        }
                    });
                    
                    // 更新计数器
                    const totalEl = document.getElementById('totalUpgradesCount');
                    const perfEl = document.getElementById('performanceCount');
                    const circuitEl = document.getElementById('circuitCount');
                    if (totalEl) totalEl.textContent = teamUpgrades.length;
                    if (perfEl) perfEl.textContent = perfCount;
                    if (circuitEl) circuitEl.textContent = circuitCount;
                },

                                card.style.opacity = '0.4';

                        // 取消悬停时恢复

                // === 3D 倾斜卡片交互 ===
                initTiltCards: function() {
                    const tiltCards = document.querySelectorAll('.tilt-card');
                    
                    tiltCards.forEach(card => {
                        const inner = card.querySelector('.tilt-card-inner');
                        if (!inner) return;

                        // 鼠标移动事件 (节流处理)
                        let ticking = false;
                        card.addEventListener('mousemove', (e) => {
                            if (!ticking) {
                                requestAnimationFrame(() => {
                                    const rect = card.getBoundingClientRect();
                                    const x = e.clientX - rect.left;
                                    const y = e.clientY - rect.top;
                                    const centerX = rect.width / 2;
                                    const centerY = rect.height / 2;
                                    
                                    // 计算倾斜角度 (-15 到 15 度)
                                    const rotateY = ((x - centerX) / centerX) * 15;
                                    const rotateX = ((centerY - y) / centerY) * 15;
                                    
                                    inner.style.setProperty('--rotate-x', `${rotateX}deg`);
                                    inner.style.setProperty('--rotate-y', `${rotateY}deg`);
                                    ticking = false;
                                });
                                ticking = true;
                            }
                        });

                        // 鼠标离开时重置
                        card.addEventListener('mouseleave', () => {
                            inner.style.setProperty('--rotate-x', '0deg');
                            inner.style.setProperty('--rotate-y', '0deg');
                        });
                    });
                },

                // === 数据刷新闪烁效果 ===
                flashDataUpdate: function(elementId) {
                    const element = document.getElementById(elementId);
                    if (element) {
                        element.classList.add('data-flash');
                        setTimeout(() => {
                            element.classList.remove('data-flash');
                        }, 600);
                    }
                },

                // === 交错入场动画 (用于 Tab 切换) ===
                staggerEntrance: function(containerSelector, itemSelector, baseDelay = 50) {
                    const container = document.querySelector(containerSelector);
                    if (!container) return;

                    const items = container.querySelectorAll(itemSelector);
                    items.forEach((item, index) => {
                        item.style.animationDelay = `${index * baseDelay}ms`;
                        item.classList.add('stagger-card');
                    });
                },

                // === 滚动驱动入场动画初始化 ===
                initScrollReveal: function() {
                    const reveals = document.querySelectorAll('.reveal');
                    
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('visible');
                            }
                        });
                    }, {
                        threshold: 0.1,
                        rootMargin: '0px 0px -50px 0px'
                    });

                    reveals.forEach(el => observer.observe(el));
                },

                // === 升级追踪器入场动画 ===
                animateUpgradesIn: function() {
                    const cards = document.querySelectorAll('.upgrade-card');
                    cards.forEach((card, index) => {
                        card.style.animationDelay = `${index * 0.08}s`;
                        card.classList.add('upgrade-card-enter');
                    });
                },

                // === 新闻卡片 3D 倾斜初始化 ===
                initNewsTilt: function() {
                    const newsCards = document.querySelectorAll('.news-card-tilt');
                    
                    newsCards.forEach(card => {
                        const inner = card.querySelector('.news-card-tilt-inner');
                        if (!inner) return;

                        let ticking = false;
                        card.addEventListener('mousemove', (e) => {
                            if (!ticking) {
                                requestAnimationFrame(() => {
                                    const rect = card.getBoundingClientRect();
                                    const x = e.clientX - rect.left;
                                    const y = e.clientY - rect.top;
                                    const centerX = rect.width / 2;
                                    const centerY = rect.height / 2;
                                    
                                    const rotateY = ((x - centerX) / centerX) * 10;
                                    const rotateX = ((centerY - y) / centerY) * 10;
                                    
                                    inner.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                                    ticking = false;
                                });
                                ticking = true;
                            }
                        });

                        card.addEventListener('mouseleave', () => {
                            inner.style.transform = 'rotateX(0) rotateY(0) scale(1)';
                        });
                    });
                }
            };
        })();

        // === 页面加载完成后初始化 ===
        document.addEventListener('DOMContentLoaded', function() {
            F1Modules.initNavigation();
            
            // 初始化 3D 倾斜卡片效果
            F1Modules.initTiltCards();
            
            // 初始化滚动驱动入场动画
            F1Modules.initScrollReveal();
            
            // 初始化新闻卡片 3D 倾斜
            F1Modules.initNewsTilt();
        });

        // === 全局 3D 倾斜卡片事件委托 ===
        document.addEventListener('mousemove', (e) => {
            const tiltCards = document.querySelectorAll('.tilt-card');
            tiltCards.forEach(card => {
                const inner = card.querySelector('.tilt-card-inner');
                if (!inner || !card.matches(':hover')) return;
                
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateY = ((x - centerX) / centerX) * 15;
                const rotateX = ((centerY - y) / centerY) * 15;
                
                inner.style.setProperty('--rotate-x', `${rotateX}deg`);
                inner.style.setProperty('--rotate-y', `${rotateY}deg`);
            });
        });
    </script>
